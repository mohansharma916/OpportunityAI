# Runs the API and the dashboard. The apply worker is not in Docker: it drives your own
# Chrome profile on the Mac, so run it on the host (see README). The API and the worker share
# the SQLite database in the project folder and the screenshots in ~/.opportunity-os.

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: opportunity_api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/opportunity_os.db
      # Mounted at the same path as on the Mac, so screenshot paths saved by the worker resolve here too
      - OPPORTUNITY_OS_HOME=${HOME}/.opportunity-os
    ports:
      - "8000:8000"
    volumes:
      - .:/data
      - ${HOME}/.opportunity-os:${HOME}/.opportunity-os
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
      args:
        INTERNAL_API_URL: http://api:8000
    container_name: opportunity_web
    restart: unless-stopped
    environment:
      - INTERNAL_API_URL=http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
